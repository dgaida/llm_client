site_name: LLM Client Documentation
site_description: Universal Python client for LLM access with multi-provider support, streaming, async, and token counting
site_author: Daniel Gaida
site_url: https://dgaida.github.io/llm_client/

repo_name: dgaida/llm_client
repo_url: https://github.com/dgaida/llm_client
edit_uri: edit/master/docs/

theme:
  name: material
  language: de
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - navigation.indexes

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: de
          name: Deutsch
          default: true
        - locale: en
          name: English
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_category_heading: true
            docstring_style: google
  - mermaid2
  - mike

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Installation: installation.md
  - Getting Started: getting-started.md
  - Usage:
      - Overview: usage/index.md
      - CLI: usage/cli.md
      - Examples: usage/basic-usage.md
      - Provider Switching: usage/provider_switching.md
      - Providers:
          - Overview: usage/providers/index.md
          - OpenAI: usage/providers/openai.md
          - Groq: usage/providers/groq.md
          - Gemini: usage/providers/gemini.md
          - Ollama: usage/providers/ollama.md
          - Ollama Cloud: usage/providers/ollama_cloud.md
  - Features:
      - Overview: features.md
      - Token Counting: usage/token-counting.md
  - API Reference:
      - Overview: api/index.md
      - LLMClient: api/llm_client.md
      - Configuration: api/config.md
      - Providers:
          - Base Provider: api/providers_base_provider.md
          - Sync Providers: api/providers_providers.md
          - Async Providers: api/providers_async_providers.md
          - Provider Factory: api/providers_provider_factory.md
          - LlamaIndex Adapter: api/providers_adapter.md
      - Utils:
          - Token Counter: api/utils_token_counter.md
          - File Utilities: api/utils_file_utils.md
          - Logging Configuration: api/utils_logging_config.md
      - CLI: api/cli.md
      - Exceptions: api/exceptions.md
  - Architecture: architecture/index.md
  - Development:
      - Testing: development/testing.md
      - Logging: development/logging.md
      - Contributing: development/contributing.md
  - Troubleshooting: troubleshooting.md
  - Metrics: metrics.md
  - Changelog: changelog.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dgaida/llm_client
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/llm-client/

