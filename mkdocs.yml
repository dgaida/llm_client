site_name: LLM Client Documentation
site_description: Universal Python client for LLM access with multi-provider support, streaming, async, and token counting
site_author: Daniel Gaida
site_url: https://dgaida.github.io/llm_client/

repo_name: dgaida/llm_client
repo_url: https://github.com/dgaida/llm_client
edit_uri: edit/master/docs/

theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_category_heading: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting_started.md
      - Quick Start: getting_started.md#basic-setup
  - Features:
      - Token Counting: features/token_counting.md
      - Async Support: features/async_support.md
      - Configuration Files: features/configuration.md
      - Response Streaming: features/streaming.md
      - Provider Switching: features/provider_switching.md
      - Tool Calling: features/tool_calling.md
      - File Upload: features/file_upload.md
  - Providers:
      - OpenAI: providers/openai.md
      - Groq: providers/groq.md
      - Google Gemini: providers/gemini.md
      - Ollama (Local): providers/ollama.md
      - Ollama Cloud: providers/ollama_cloud.md
  - Examples:
      - Basic Usage: examples/basic-usage.md
      - Provider Switching: examples/provider_switching.md
  - Reference:
      - Overview: api_reference.md
      - API Reference:
          - LLMClient: api/llm_client.md
          - Configuration: api/config.md
          - Providers:
              - Base Provider: api/providers_base_provider.md
              - Sync Providers: api/providers_providers.md
              - Async Providers: api/providers_async_providers.md
              - Provider Factory: api/providers_provider_factory.md
          - Utils:
              - Token Counter: api/utils_token_counter.md
              - File Utilities: api/utils_file_utils.md
              - Logging: api/utils_logging_config.md
          - Integrations:
              - LlamaIndex: api/providers_adapter.md
          - Exceptions: api/exceptions.md
      - CLI Reference: api/cli.md
      - Testing: TESTING.md
      - Logging: LOGGING.md
  - Troubleshooting: troubleshooting.md
  - Contributing: CONTRIBUTING.md
  - Changelog: CHANGELOG.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dgaida/llm_client
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/llm-client/

