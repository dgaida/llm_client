name: Documentation

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e ".[all]"
          pip install interrogate mkdocs-material mkdocs-static-i18n mkdocstrings[python] mkdocs-mermaid2-plugin mike beautifulsoup4 playwright

      - name: Run tests
        run: python -m pytest

      - name: Check API doc coverage
        run: interrogate llm_client/ --fail-under 95

      - name: Build MkDocs
        run: mkdocs build --strict

      - name: Deploy with mike
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1
          if [ -n "\${{ github.event.release.tag_name }}" ]; then
            mike deploy --push --update-aliases \${{ github.event.release.tag_name }} latest
          elif [ "\${{ github.ref_name }}" == "master" ]; then
            mike deploy --push --update-aliases dev latest
          fi
