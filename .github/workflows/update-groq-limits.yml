name: Update Groq Rate Limits

on:
  schedule:
    - cron: '0 0 1 * *' # Once per month on the 1st
  workflow_dispatch: # Allow manual trigger

jobs:
  update-limits:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 playwright
          playwright install chromium

      - name: Run parsing script
        run: python scripts/parse_groq_rate_limits.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add llm_client/providers/groq_rate_limits.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: update Groq rate limits [skip ci]" && git push)
