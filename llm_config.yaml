# LLM Client Configuration File
# This file configures multiple LLM providers for easy switching

# Default provider to use when none specified
default_provider: openai

# Global settings applied to all providers (can be overridden per provider)
global_settings:
  temperature: 0.7
  max_tokens: 512

# Provider-specific configurations
providers:
  # OpenAI Configuration
  openai:
    model: gpt-4o-mini
    temperature: 0.7
    max_tokens: 512

  # Groq Configuration
  groq:
    model: qwen/qwen3-32b
    temperature: 0.5
    max_tokens: 1024

  # Google Gemini Configuration
  gemini:
    model: gemini-2.0-flash-exp
    temperature: 0.8
    max_tokens: 2048

  # Local Ollama Configuration
  ollama:
    model: llama3.2:1b
    temperature: 0.7
    max_tokens: 512
    keep_alive: 5m
    use_cloud: false  # Set to true for Ollama Cloud
    # host: http://localhost:11434  # Optional: Custom host

  # Ollama Cloud Configuration (alternative)
  ollama_cloud:
    model: gpt-oss:120b-cloud
    temperature: 0.7
    max_tokens: 1024
    use_cloud: true
    # host: https://ollama.com  # Optional: Custom cloud host
